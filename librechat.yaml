version: 1.3.13
cache: true

# ---------------------------------------------------------------
# OpenRouter models
# ---------------------------------------------------------------
endpoints:
  custom:
    - name: 'OpenRouter'
      apiKey: '${OPENROUTER_KEY}'
      baseURL: 'https://openrouter.ai/api/v1'
      models:
        default: ['anthropic/claude-sonnet-4.5']
        fetch: true
      titleConvo: true
      titleModel: 'current_model'
      modelDisplayLabel: 'OpenRouter'
      dropParams: ['stop']

# ---------------------------------------------------------------
# Model specs — this instance requires one to be defined
# ---------------------------------------------------------------
modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: 'or-sonnet'
      label: 'Claude Sonnet 4.5'
      default: true
      description: 'Claude Sonnet 4.5 via OpenRouter'
      preset:
        endpoint: 'OpenRouter'
        model: 'anthropic/claude-sonnet-4.5'

# ---------------------------------------------------------------
# Connectors
# Deliberately NOT included, per Ian: zoho_books, zoho_leads
# ---------------------------------------------------------------
mcpServers:

  # --- HDM custom servers (shared bearer tokens) ---

  zoho_crm_read:
    type: streamable-http
    url: 'https://hdm-zoho-mcp-production.up.railway.app/mcp'
    headers:
      Authorization: 'Bearer ${HDM_ZOHO_TOKEN}'
      X-User-Email: 'micaht@maxwellpower.com'
      X-Agent-Surface: 'librechat'
    timeout: 60000
    initTimeout: 150000
    startup: false

  solar_telemetry:
    type: streamable-http
    url: 'https://tesla-telemetry-mcp-production.up.railway.app/mcp'
    headers:
      Authorization: 'Bearer ${HDM_SOLAR_TOKEN}'
    timeout: 60000
    initTimeout: 150000
    startup: false

  hdm_knowledge_base:
    type: streamable-http
    url: 'https://hdm-knowledge.vercel.app/api/mcp/mcp'
    headers:
      Authorization: 'Bearer ${HDM_KB_TOKEN}'
      x-org-slug: 'hdm'
    timeout: 60000
    initTimeout: 150000
    startup: false

  # --- Google Workspace (each person logs in as themselves) ---

  gmail:
    type: streamable-http
    url: 'https://gmailmcp.googleapis.com/mcp/v1'
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
      token_url: 'https://oauth2.googleapis.com/token'
      client_id: '${GOOGLE_MCP_CLIENT_ID}'
      client_secret: '${GOOGLE_MCP_CLIENT_SECRET}'
      scope: 'https://www.googleapis.com/auth/gmail.modify https://www.googleapis.com/auth/gmail.compose'
      redirect_uri: 'https://librechat-production-a04a.up.railway.app/api/mcp/gmail/oauth/callback'
      token_exchange_method: default_post

  calendar:
    type: streamable-http
    url: 'https://calendarmcp.googleapis.com/mcp/v1'
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
      token_url: 'https://oauth2.googleapis.com/token'
      client_id: '${GOOGLE_MCP_CLIENT_ID}'
      client_secret: '${GOOGLE_MCP_CLIENT_SECRET}'
      scope: 'https://www.googleapis.com/auth/calendar.calendarlist.readonly https://www.googleapis.com/auth/calendar.events.readonly https://www.googleapis.com/auth/calendar.events.freebusy'
      redirect_uri: 'https://librechat-production-a04a.up.railway.app/api/mcp/calendar/oauth/callback'
      token_exchange_method: default_post

  drive:
    type: streamable-http
    url: 'https://drivemcp.googleapis.com/mcp/v1'
    timeout: 60000
    initTimeout: 150000
    requiresOAuth: true
    startup: false
    oauth:
      authorization_url: 'https://accounts.google.com/o/oauth2/v2/auth?access_type=offline&prompt=consent'
      token_url: 'https://oauth2.googleapis.com/token'
      client_id: '${GOOGLE_MCP_CLIENT_ID}'
      client_secret: '${GOOGLE_MCP_CLIENT_SECRET}'
      scope: 'https://www.googleapis.com/auth/drive.readonly https://www.googleapis.com/auth/drive.file'
      redirect_uri: 'https://librechat-production-a04a.up.railway.app/api/mcp/drive/oauth/callback'
      token_exchange_method: default_post

# ---------------------------------------------------------------
# Plugin skills, pulled from GitHub hourly
# ---------------------------------------------------------------
skillSync:
  github:
    enabled: true
    intervalMinutes: 60
    runOnStartup: true
    sources:
      - id: hdm-zoho
        owner: iancollins-hdm
        repo: hdm-zoho-mcp
        ref: main
        paths:
          - plugin/skills
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'
      - id: solar-telemetry
        owner: iancollins-hdm
        repo: hdm-solar-telemetry
        ref: master
        paths:
          - plugins/solar-telemetry/skills
        skillDiscoveryDepth: 2
        token: '${GITHUB_SKILLS_TOKEN}'
